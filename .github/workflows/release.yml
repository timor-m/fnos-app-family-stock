name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Download fnpack
        run: npm run download:fnpack

      - name: Pack fpk
        run: npm run pack:fpk

      - name: Prepare release notes
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then
              echo "标签 v${TAG_VERSION} 与 package.json ${PACKAGE_VERSION} 不一致"
              exit 1
            fi
          fi
          export VERSION="${PACKAGE_VERSION}"
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const version = process.env.VERSION;
            const template = JSON.parse(readFileSync("template.config.json", "utf8"));
            const notes = template.releaseNotes || {};
            const highlights = Array.isArray(notes.highlights) ? notes.highlights : [];
            const lines = [`# 家藏 v${version}`, "", notes.summary || template.appDescription || "", ""];
            for (const item of highlights) lines.push(`- ${item}`);
            lines.push("");
            writeFileSync("RELEASE_NOTES.md", lines.join("\n"));
          '
          echo "release_name=家藏 v${VERSION}" >> "$GITHUB_ENV"
          echo "release_tag=v${VERSION}" >> "$GITHUB_ENV"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.release_tag }}
          name: ${{ env.release_name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/app.tgz
            dist/*.fpk
